[package]
name = "rediff"
version = "0.50.0-rc.6"
edition = "2024"
rust-version = "1.92"
authors = ["Amos Wenger <amos@bearcove.eu>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/bearcove/rediff"
description = "Diff and compare Facet values with detailed structural difference reporting"
documentation = "https://docs.rs/rediff"
keywords = ["diff", "compare", "testing", "facet", "assertion"]
categories = ["development-tools::testing", "rust-patterns"]
homepage = "https://facet.rs"

[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "arborium-header.html"]

[features]
default = []
tracing = ["dep:tracing"]

[dependencies]
facet = "0.50.0-rc.6"
facet-core = "0.50.0-rc.6"
facet-pretty = "0.50.0-rc.6"
facet-reflect = "0.50.0-rc.6"
confusables = "0.1"
indextree = "4"
owo-colors = "4.2.3"
palette = { version = "0.7", default-features = false, features = ["std"] }
terminal-colorsaurus = "1"
unicode-width = "0.2.2"
tracing = { version = "0.1.43", default-features = false, features = [
  "std",
  "attributes",
], optional = true }

[dev-dependencies]
facet = { version = "0.50.0-rc.6", features = ["all-impls"] }
tracing = { version = "0.1.43", default-features = false, features = [
  "std",
  "attributes",
] }

[lints.clippy]
disallowed_methods = "deny"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  "cfg(facet_no_doc)",
  "cfg(kani)",
] }
